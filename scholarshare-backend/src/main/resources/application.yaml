spring:
  application:
    name: scholarshare-backend
  datasource:
    url: jdbc:mysql://localhost:3306/scholarshare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: Ark@r122181
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  #  jackson:
  #    time-zone: UTC
  #    serialization:
  #      write-dates-as-timestamps: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

    security:
     oauth2:
       client:
         registration:
           google:
             client-id: ${GOOGLE_CLIENT_ID}
             client-secret: ${GOOGLE_CLIENT_SECRET}
             scope:
               - email
               - profile

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

jwt:
  secret: oY9ISzMqyrSljCQcebeyrY70rZwp+wKuETagneodNzM=
  expiration: 86400000            # access accessToken, 24 hours (milliseconds)
  refresh-expiration: 604800000   # refresh accessToken, 7 days (milliseconds)

app:
  upload-dir: uploads
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
